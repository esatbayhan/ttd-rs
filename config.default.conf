# ttd configuration
# Copy to ~/.config/ttd/config.conf or $XDG_CONFIG_HOME/ttd/config.conf
#
# task_dir is the path to your todo.txt.d directory (required).
# All other settings are optional key=value pairs.

task_dir=~/tasks/todo.txt.d

# External editor command (default: $VISUAL or $EDITOR or vi)
# editor=vim

# Sidebar width as percentage of terminal width (default: 20, range: 0-100)
# sidebar_width=20

# Minimum sidebar width as percentage of terminal width (default: 0)
# sidebar_min_width=0

# Maximum sidebar width as percentage of terminal width (default: 50)
# sidebar_max_width=50

# Show bottom help bar on startup (default: true)
# show_help_bar=true

# Automatically set updated:YYYY-MM-DD when editing a task (default: false)
# auto_update_on_edit=false

# Enable syntax highlighting in the task editor (default: true)
# editor_highlighting=true
